[build]
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/client/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/client/collections"
  to = "/.netlify/functions/collections"
  status = 200

[[redirects]]
  from = "/api/client/collection-products/:splat"
  to = "/.netlify/functions/collection-products"
  status = 200

[[redirects]]
  from = "/api/checkout/token"
  to = "/.netlify/functions/checkout-token"
  status = 200

[[redirects]]
  from = "/api/checkout/status"
  to = "/.netlify/functions/checkout-status"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
